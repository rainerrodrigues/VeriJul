name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  # Cancel superseded runs on the same branch / PR
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1.11', '1']
        os: [ubuntu-latest]
        include:
          - julia-version: '1'
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Verilator (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y verilator g++

      - name: Install Verilator (macOS)
        if: runner.os == 'macOS'
        run: brew install verilator

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  verilog-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: Lint Verilog sources
        run: find examples test \( -name "*.v" -o -name "*.sv" \) -print0 | xargs -0 -r -n1 verilator --lint-only -Wno-WIDTHEXPAND
